name: Frontend CI/CD

on:
  push:
    branches:
      - main
      - latest
      - honey
  workflow_dispatch:

concurrency:
  group: frontend-deploy-main
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: Frontend/dist

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/latest' || github.ref == 'refs/heads/honey'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: Setup SSH key
        shell: bash
        run: |
          set -euo pipefail

          VM_HOST="${{ secrets.VM_HOST }}"
          VM_PORT="${{ secrets.VM_PORT || '22' }}"

          if [ -z "$VM_HOST" ]; then
            echo "VM_HOST secret is empty."
            exit 1
          fi

          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VM_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          if ! ssh-keyscan -T 10 -p "$VM_PORT" "$VM_HOST" >> ~/.ssh/known_hosts 2>/tmp/ssh-keyscan.err; then
            echo "ssh-keyscan failed for $VM_HOST:$VM_PORT"
            echo "Common causes:"
            echo "- the VM public IP changed after stop/start"
            echo "- the VM is still stopped"
            echo "- SSH is not running on the VM"
            echo "- the firewall/security group blocks port $VM_PORT"
            cat /tmp/ssh-keyscan.err
            exit 1
          fi

      - name: Sync build to VM
        shell: bash
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -p ${{ secrets.VM_PORT || '22' }}" \
            dist/ \
            "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:${{ secrets.VM_DEPLOY_PATH }}/releases/${{ github.sha }}/"

      - name: Activate release on VM
        shell: bash
        run: |
          ssh -i ~/.ssh/id_ed25519 -p "${{ secrets.VM_PORT || '22' }}" "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}" \
            "export DEPLOY_PATH='${{ secrets.VM_DEPLOY_PATH }}' && export RELEASE_SHA='${{ github.sha }}' && bash -s" \
            < deploy/deploy_frontend.sh
