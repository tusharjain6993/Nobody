name: Frontend CI/CD

on:
  push:
    branches:
      - main
      - latest
      - honey
  workflow_dispatch:

concurrency:
  group: frontend-deploy-main
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: Frontend/dist

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/latest' || github.ref == 'refs/heads/honey'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: Setup SSH key
        shell: bash
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VM_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ secrets.VM_PORT || '22' }}" "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync build to VM
        shell: bash
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -p ${{ secrets.VM_PORT || '22' }}" \
            dist/ \
            "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:${{ secrets.VM_DEPLOY_PATH }}/releases/${{ github.sha }}/"

      - name: Activate release on VM
        shell: bash
        run: |
          ssh -i ~/.ssh/id_ed25519 -p "${{ secrets.VM_PORT || '22' }}" "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}" \
            "export DEPLOY_PATH='${{ secrets.VM_DEPLOY_PATH }}' && export RELEASE_SHA='${{ github.sha }}' && bash -s" \
            < deploy/deploy_frontend.sh
