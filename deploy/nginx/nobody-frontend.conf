server {
    listen 80;
    server_name _;

    root /var/www/nobody-frontend/current;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location = /sql-wasm.wasm {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }
}
